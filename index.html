
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Selvi Silks - Grand Diwali 2.0</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 18px 12px;
    min-height: 100vh;
    background: linear-gradient(135deg,#f8eaff,#ead7ff,#fff0e6);
    font-family: Arial, sans-serif;
    text-align: center;
    overflow-x: hidden;
}

h1 {
    color: #6500bd;
    font-size: 34px;
    margin: 10px 0;
}

.subtitle {
    color: #71318c;
    font-size: 18px;
    margin-bottom: 20px;
}

/* FIREWORKS */

.fireworks {
    position: fixed;
    top: 0;
    bottom: 0;
    width: 65px;
    overflow: hidden;
    pointer-events: none;
    z-index: 1;
}

.left { left: 0; }
.right { right: 0; }

.spark {
    position: absolute;
    font-size: 23px;
    animation: sparkle 2s infinite;
}

.spark:nth-child(1) { top: 12%; left: 20%; }
.spark:nth-child(2) { top: 28%; left: 60%; animation-delay: .5s; }
.spark:nth-child(3) { top: 45%; left: 15%; animation-delay: 1s; }
.spark:nth-child(4) { top: 65%; left: 60%; animation-delay: .3s; }
.spark:nth-child(5) { top: 83%; left: 25%; animation-delay: .8s; }

@keyframes sparkle {
    0%,100% {
        transform: scale(.4) rotate(0deg);
        opacity: .2;
    }
    50% {
        transform: scale(1.5) rotate(90deg);
        opacity: 1;
    }
}

/* SELFIE BOOTH */

.booth {
    width: min(100%, 540px);
    margin: auto;
    padding: 12px;

    background: linear-gradient(
        145deg,
        #8500d5,
        #5700a0,
        #30005c
    );

    border: 7px solid #e7c46d;
    border-radius: 40px;

    box-shadow: 0 12px 35px #55008035;

    position: relative;
    z-index: 2;
}

.brand {
    padding: 14px 5px;
    color: #fff0c2;
    font-size: 21px;
    font-weight: bold;
    letter-spacing: 1px;
}

/* LIVE CANVAS */

.camera-stage {
    width: 100%;
    aspect-ratio: 1144 / 1375;
    position: relative;
    overflow: hidden;
    background: #310052;
}

#previewCanvas {
    display: block;
    width: 100%;
    height: 100%;
}

/* FINAL PHOTO */

#result {
    display: none;
    width: 100%;
    height: auto;
    aspect-ratio: 1144 / 1375;
    background: #310052;
}

/* WISHES */

.wishes {
    margin: 12px 0;
    padding: 17px 5px;

    background: linear-gradient(
        135deg,
        #fff,
        #f1e2ff
    );

    color: #6500b5;
    border: 3px solid #e7c46d;
    border-radius: 20px;

    font: bold italic 30px Georgia, serif;
}

.wishes small {
    display: block;
    font: bold 14px Arial;
    margin-bottom: 5px;
}

/* BUTTONS */

button {
    width: 100%;
    margin-top: 10px;
    padding: 15px 10px;

    border: 2px solid #f4d995;
    border-radius: 12px;

    font-size: 16px;
    font-weight: bold;
    cursor: pointer;

    background: #f0d17e;
    color: #4c087a;
}

button:disabled {
    opacity: .4;
    cursor: not-allowed;
}

.secondary {
    background: #fff;
    color: #6500b5;
    border-color: #d9b9ef;
}

.status {
    color: #6500a9;
    font-size: 14px;
    line-height: 1.5;
    margin: 15px auto;
    max-width: 500px;
}

.note {
    color: #71318c;
    font-size: 12px;
    margin: 15px auto;
    line-height: 1.6;
}

@media(max-width:600px) {
    .fireworks { width: 32px; }
    .spark { font-size: 15px; }
    h1 { font-size: 27px; }
    .brand { font-size: 17px; }
    .wishes { font-size: 26px; }
}

@media(prefers-reduced-motion:reduce) {
    .spark { animation: none; }
}
</style>
</head>

<body>

<!-- LEFT FIREWORKS -->

<div class="fireworks left">
    <span class="spark">✨</span>
    <span class="spark">⭐</span>
    <span class="spark">💜</span>
    <span class="spark">✨</span>
    <span class="spark">🌟</span>
</div>

<!-- RIGHT FIREWORKS -->

<div class="fireworks right">
    <span class="spark">🌟</span>
    <span class="spark">✨</span>
    <span class="spark">💜</span>
    <span class="spark">⭐</span>
    <span class="spark">✨</span>
</div>

<!-- HEADER -->

<h1>🪔 Selvi Silks 🪔</h1>

<div class="subtitle">
    Capture Your Diwali Memories!
</div>

<!-- BOOTH -->

<div class="booth">

    <div class="brand">
        GRAND DIWALI SELFIE BOOTH
    </div>

    <!-- CAMERA COMPOSITE -->

    <div class="camera-stage" id="cameraStage">
        <canvas
            id="previewCanvas"
            width="1144"
            height="1375">
        </canvas>
    </div>

    <!-- CAPTURED PHOTO -->

    <canvas
        id="result"
        width="1144"
        height="1375">
    </canvas>

    <!-- WISHES -->

    <div class="wishes">
        <small>Wishing You a</small>
        Happy Diwali!
        <small>✨ Let Your Happiness Shine ✨</small>
    </div>

    <!-- CONTROLS -->

    <button id="start">
        📸 Start Camera
    </button>

    <button id="capture" disabled>
        ✨ Take Selfie
    </button>

    <button id="retake" class="secondary" disabled>
        🔄 Retake Photo
    </button>

    <button id="download" class="secondary" disabled>
        ⬇ Download Photo
    </button>

    <button id="whatsapp" disabled>
        💚 Share on WhatsApp
    </button>

    <button id="instagram" disabled>
        📷 Share on Instagram
    </button>

</div>

<div class="note">
    Celebrate the Festival of Lights with Selvi Silks!
</div>

<div class="status" id="status">
    Loading Selvi Silks Frame...
</div>


<script>

// ======================================
// ELEMENTS
// ======================================

const video = document.createElement("video");

video.autoplay = true;
video.playsInline = true;
video.muted = true;

const preview = document.getElementById("previewCanvas");
const previewCtx = preview.getContext("2d");

const result = document.getElementById("result");
const resultCtx = result.getContext("2d");

const cameraStage = document.getElementById("cameraStage");

const statusText = document.getElementById("status");

const startBtn = document.getElementById("start");
const captureBtn = document.getElementById("capture");
const retakeBtn = document.getElementById("retake");
const downloadBtn = document.getElementById("download");
const whatsappBtn = document.getElementById("whatsapp");
const instagramBtn = document.getElementById("instagram");

const W = 1144;
const H = 1375;

let stream = null;
let photoReady = false;
let cameraActive = false;
let animationId = null;


// ======================================
// IMAGE LOADING
// ======================================

const frame = new Image();
const mask = new Image();

function loadImage(image, path) {

    return new Promise((resolve, reject) => {

        image.onload = resolve;

        image.onerror = () => reject(
            new Error("Image not found: " + path)
        );

        image.src = path;

    });

}

const assetsReady = Promise.all([

    loadImage(
        frame,
        "./selvi-grand-diwali-frame-wide.png"
    ),

    loadImage(
        mask,
        "./selvi-window-mask-wide.png"
    )

]);


// ======================================
// OFFSCREEN SELFIE CANVAS
// ======================================

const selfieCanvas = document.createElement("canvas");

selfieCanvas.width = W;
selfieCanvas.height = H;

const selfieCtx = selfieCanvas.getContext("2d");


// ======================================
// BACKGROUND DESIGN
// ======================================

function drawBackground(ctx) {

    // Purple gradient

    const gradient = ctx.createLinearGradient(
        0, 0, W, H
    );

    gradient.addColorStop(0, "#230038");
    gradient.addColorStop(0.35, "#510078");
    gradient.addColorStop(0.7, "#36005c");
    gradient.addColorStop(1, "#19002c");

    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, W, H);

    // Golden glow

    const glow = ctx.createRadialGradient(
        W / 2,
        H / 2,
        50,
        W / 2,
        H / 2,
        700
    );

    glow.addColorStop(
        0,
        "rgba(180,100,255,0.18)"
    );

    glow.addColorStop(
        1,
        "rgba(20,0,40,0)"
    );

    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, W, H);

    // Subtle golden decorations

    const stars = [
        [70,180],
        [1060,180],
        [70,500],
        [1070,500],
        [85,1050],
        [1050,1050],
        [250,80],
        [900,80]
    ];

    ctx.fillStyle = "rgba(255,207,100,0.7)";
    ctx.font = "28px Georgia";

    stars.forEach(([x,y]) => {
        ctx.fillText("✦", x, y);
    });

}


// ======================================
// DRAW CAMERA ONLY IN CENTRE MASK
// ======================================

function drawSelfieOnly(ctx) {

    if (!video.videoWidth || !video.videoHeight) {
        return;
    }

    selfieCtx.clearRect(0, 0, W, H);

    // Match camera crop to frame ratio

    const targetRatio = W / H;

    const sourceRatio =
        video.videoWidth / video.videoHeight;

    let sx = 0;
    let sy = 0;
    let sw = video.videoWidth;
    let sh = video.videoHeight;

    if (sourceRatio > targetRatio) {

        sw = video.videoHeight * targetRatio;
        sx = (video.videoWidth - sw) / 2;

    } else {

        sh = video.videoWidth / targetRatio;
        sy = (video.videoHeight - sh) / 2;

    }

    // Mirror the selfie

    selfieCtx.save();

    selfieCtx.translate(W, 0);
    selfieCtx.scale(-1, 1);

    selfieCtx.drawImage(
        video,
        sx,
        sy,
        sw,
        sh,
        0,
        0,
        W,
        H
    );

    selfieCtx.restore();

    // IMPORTANT:
    // Keep camera ONLY inside the transparent arch mask.

    selfieCtx.globalCompositeOperation =
        "destination-in";

    selfieCtx.drawImage(
        mask,
        0,
        0,
        W,
        H
    );

    selfieCtx.globalCompositeOperation =
        "source-over";

    // Draw masked camera onto background

    ctx.drawImage(
        selfieCanvas,
        0,
        0,
        W,
        H
    );

}


// ======================================
// COMPLETE FRAME COMPOSITION
// ======================================

function drawComposition(ctx) {

    // 1. Draw background everywhere

    drawBackground(ctx);

    // 2. Draw selfie ONLY inside arch opening

    drawSelfieOnly(ctx);

    // 3. Draw original decorative frame on top

    ctx.drawImage(
        frame,
        0,
        0,
        W,
        H
    );

}


// ======================================
// LIVE PREVIEW
// ======================================

function renderPreview() {

    if (!cameraActive) return;

    drawComposition(previewCtx);

    animationId = requestAnimationFrame(
        renderPreview
    );

}


// ======================================
// BUTTON CONTROL
// ======================================

function setButtons(enabled) {

    downloadBtn.disabled = !enabled;
    whatsappBtn.disabled = !enabled;
    instagramBtn.disabled = !enabled;
    retakeBtn.disabled = !enabled;

}


// ======================================
// START CAMERA
// ======================================

async function startCamera() {

    try {

        startBtn.disabled = true;

        statusText.textContent =
            "Loading Selvi Silks Frame...";

        await assetsReady;

        if (!navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia) {

            throw new Error(
                "Camera requires HTTPS or localhost."
            );

        }

        if (stream) {

            stream.getTracks().forEach(
                track => track.stop()
            );

        }

        statusText.textContent =
            "Requesting Camera Permission...";

        stream = await navigator.mediaDevices.getUserMedia({

            video: {
                facingMode: "user",
                width: { ideal: 1280 },
                height: { ideal: 1600 }
            },

            audio: false

        });

        video.srcObject = stream;

        await new Promise((resolve, reject) => {

            video.onloadedmetadata = resolve;

            video.onerror = () => reject(
                new Error("Camera preview failed.")
            );

        });

        await video.play();

        cameraStage.style.display = "block";
        result.style.display = "none";

        photoReady = false;
        cameraActive = true;

        captureBtn.disabled = false;

        setButtons(false);

        cancelAnimationFrame(animationId);

        renderPreview();

        statusText.textContent =
            "Camera Ready! Your Face Will Appear Inside the Centre.";

    }

    catch (error) {

        console.error(error);

        statusText.textContent =
            "Camera Error: " + error.message;

        captureBtn.disabled = true;

    }

    finally {

        startBtn.disabled = false;

    }

}


// ======================================
// CAPTURE PHOTO
// ======================================

async function capturePhoto() {

    if (!video.videoWidth) {

        statusText.textContent =
            "Camera is not ready.";

        return;

    }

    try {

        captureBtn.disabled = true;

        await assetsReady;

        // Draw the exact same composition

        drawComposition(resultCtx);

        // Stop live preview

        cameraActive = false;

        cancelAnimationFrame(animationId);

        // Display final photo

        cameraStage.style.display = "none";
        result.style.display = "block";

        photoReady = true;

        setButtons(true);

        statusText.textContent =
            "Grand Diwali Selfie Captured Successfully!";

    }

    catch (error) {

        console.error(error);

        statusText.textContent =
            "Capture Error: " + error.message;

    }

    finally {

        captureBtn.disabled = false;

    }

}


// ======================================
// CREATE IMAGE FILE
// ======================================

function makeFile() {

    return new Promise((resolve, reject) => {

        result.toBlob(blob => {

            if (!blob) {

                reject(
                    new Error("Photo creation failed.")
                );

                return;

            }

            resolve(new File(
                [blob],
                "Selvi-Silks-Grand-Diwali.png",
                { type: "image/png" }
            ));

        }, "image/png");

    });

}


// ======================================
// DOWNLOAD PHOTO
// ======================================

function downloadFile(file) {

    const url = URL.createObjectURL(file);

    const link = document.createElement("a");

    link.href = url;

    link.download =
        "Selvi-Silks-Grand-Diwali.png";

    document.body.appendChild(link);

    link.click();

    link.remove();

    setTimeout(() => {
        URL.revokeObjectURL(url);
    }, 60000);

}

downloadBtn.addEventListener("click", async () => {

    try {

        if (!photoReady) return;

        const file = await makeFile();

        downloadFile(file);

        statusText.textContent =
            "Photo Downloaded Successfully!";

    }

    catch (error) {

        statusText.textContent = error.message;

    }

});


// ======================================
// WHATSAPP AND INSTAGRAM
// ======================================

async function sharePhoto(app) {

    if (!photoReady) return;

    try {

        const file = await makeFile();

        if (
            navigator.share &&
            navigator.canShare &&
            navigator.canShare({ files: [file] })
        ) {

            await navigator.share({

                files: [file],

                title: "Selvi Silks Grand Diwali",

                text:
                    "Happy Diwali from Selvi Silks! 🪔✨"

            });

            statusText.textContent =
                "Choose " + app + " from the share menu.";

            return;

        }

        // Fallback for unsupported browsers

        downloadFile(file);

        if (app === "WhatsApp") {

            window.open(
                "https://wa.me/?text=" +
                encodeURIComponent(
                    "Happy Diwali from Selvi Silks! 🪔✨"
                ),
                "_blank"
            );

        } else {

            window.open(
                "https://www.instagram.com/",
                "_blank"
            );

        }

        statusText.textContent =
            "Photo downloaded. Attach it in " + app + ".";

    }

    catch (error) {

        if (error.name !== "AbortError") {

            statusText.textContent =
                "Please download and share manually.";

        }

    }

}


// ======================================
// RETAKE PHOTO
// ======================================

retakeBtn.addEventListener("click", () => {

    if (!stream) return;

    photoReady = false;
    cameraActive = true;

    cameraStage.style.display = "block";
    result.style.display = "none";

    setButtons(false);

    captureBtn.disabled = false;

    cancelAnimationFrame(animationId);

    renderPreview();

    statusText.textContent =
        "Camera Ready! Take Another Selfie.";

});


// ======================================
// BUTTON EVENTS
// ======================================

startBtn.addEventListener(
    "click",
    startCamera
);

captureBtn.addEventListener(
    "click",
    capturePhoto
);

whatsappBtn.addEventListener(
    "click",
    () => sharePhoto("WhatsApp")
);

instagramBtn.addEventListener(
    "click",
    () => sharePhoto("Instagram")
);


// ======================================
// INITIAL FRAME CHECK
// ======================================

assetsReady.then(() => {

    statusText.textContent =
        "Frame Loaded! Click Start Camera.";

}).catch(error => {

    statusText.textContent =
        error.message;

    captureBtn.disabled = true;

});


// ======================================
// STOP CAMERA WHEN LEAVING
// ======================================

window.addEventListener("pagehide", () => {

    cameraActive = false;

    cancelAnimationFrame(animationId);

    if (stream) {

        stream.getTracks().forEach(
            track => track.stop()
        );

    }

});

</script>

</body>
</html>
