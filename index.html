
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GS & Co - Diwali Selfie Booth</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px 12px;
    min-height: 100vh;
    background: linear-gradient(135deg, #fff4df, #ffe1bd, #fff0d4);
    font-family: Arial, sans-serif;
    text-align: center;
    overflow-x: hidden;
}

h1 {
    color: #e94e18;
    font-size: 34px;
    margin: 10px 0;
    position: relative;
    z-index: 2;
}

.subtitle {
    color: #a65b20;
    font-size: 18px;
    margin-bottom: 22px;
    position: relative;
    z-index: 2;
}

/* =================================
   ORANGE GOLD FIREWORKS
================================= */

.fireworks {
    position: fixed;
    top: 0;
    bottom: 0;
    width: 100px;
    overflow: hidden;
    pointer-events: none;
    z-index: 1;
}

.fireworks.left { left: 0; }
.fireworks.right { right: 0; }

.spark {
    position: absolute;
    font-size: 24px;
    animation: sparkle 2s infinite ease-in-out;
    filter: drop-shadow(0 0 10px #ff9d22);
}

.spark:nth-child(1) {
    top: 12%;
    left: 20%;
}

.spark:nth-child(2) {
    top: 28%;
    left: 60%;
    animation-delay: .5s;
}

.spark:nth-child(3) {
    top: 45%;
    left: 15%;
    animation-delay: 1s;
}

.spark:nth-child(4) {
    top: 65%;
    left: 60%;
    animation-delay: .3s;
}

.spark:nth-child(5) {
    top: 83%;
    left: 25%;
    animation-delay: .8s;
}

@keyframes sparkle {
    0%, 100% {
        transform: scale(.4) rotate(0deg);
        opacity: .2;
    }

    50% {
        transform: scale(1.5) rotate(90deg);
        opacity: 1;
    }
}

.burst {
    position: absolute;
    font-size: 36px;
    animation: burst 2.5s infinite;
    filter: drop-shadow(0 0 12px orange);
}

@keyframes burst {
    0% {
        transform: scale(.2) rotate(0deg);
        opacity: 0;
    }

    40% {
        transform: scale(1.3) rotate(45deg);
        opacity: 1;
    }

    100% {
        transform: scale(.3) rotate(180deg);
        opacity: 0;
    }
}

/* CSS firework particles */

.firework {
    position: absolute;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #ffb800;

    box-shadow:
        0 -25px #ffcf33,
        18px -18px #ff6b00,
        25px 0 #ffe45e,
        18px 18px #ff8c00,
        0 25px #fff176,
        -18px 18px #ff9f1c,
        -25px 0 #ffe45e,
        -18px -18px #ff6b00;

    animation: explode 2.5s infinite;
}

.firework.one {
    top: 35%;
    left: 35%;
}

.firework.two {
    top: 72%;
    left: 45%;
    animation-delay: 1.2s;
}

@keyframes explode {
    0% {
        transform: scale(.1);
        opacity: 0;
    }

    40% {
        transform: scale(1);
        opacity: 1;
    }

    100% {
        transform: scale(.2);
        opacity: 0;
    }
}

/* =================================
   MAIN BOOTH - GS ORANGE THEME
================================= */

.booth {
    width: min(100%, 540px);
    margin: auto;
    padding: 13px;

    background: linear-gradient(
        145deg,
        #ff6b28,
        #ed4215,
        #b92c0c
    );

    border: 7px solid #e8bb50;
    border-radius: 55px 55px 20px 20px;

    box-shadow:
        0 10px 30px #a93d1e40,
        inset 0 0 20px #ffe5a033;

    position: relative;
    z-index: 2;
}

.brand {
    padding: 17px 5px;
    color: #fff0b3;
    font-size: 25px;
    font-weight: bold;
    letter-spacing: 2px;
}

#camera,
#result {
    display: block;
    width: 100%;
    aspect-ratio: 4 / 5;
    object-fit: cover;
    background: #fff6e7;
    border: 6px solid #e9bf64;
    border-radius: 30px 30px 10px 10px;
}

#camera {
    transform: scaleX(-1);
}

#result {
    display: none;
}

/* GREETING */

.wishes {
    margin: 15px 0 5px;
    padding: 17px 5px;

    background: linear-gradient(
        135deg,
        #fff0c0,
        #ffd17c
    );

    color: #a52b0b;
    border: 4px solid #e6ae3c;
    border-radius: 25px;

    font: italic bold 35px Georgia, serif;
}

.wishes small {
    display: block;
    font: bold 15px Arial, sans-serif;
    margin-bottom: 5px;
}

/* BUTTONS */

button {
    width: 100%;
    margin-top: 11px;
    padding: 15px 10px;

    border: 2px solid #ffdf91;
    border-radius: 12px;

    font-size: 16px;
    font-weight: bold;
    cursor: pointer;

    background: #f2b83f;
    color: #76230c;
}

button:disabled {
    opacity: .4;
    cursor: not-allowed;
}

.secondary {
    background: #fff0d0;
    color: #a52b0b;
    border-color: #e8b65b;
}

.status {
    color: #963412;
    font-size: 14px;
    margin: 15px auto;
    max-width: 500px;
    line-height: 1.5;
    position: relative;
    z-index: 2;
}

.note {
    color: #81502b;
    font-size: 12px;
    line-height: 1.6;
    max-width: 500px;
    margin: 15px auto;
    position: relative;
    z-index: 2;
}

/* =================================
   RESPONSIVE DESIGN
================================= */

@media(max-width: 600px) {

    .fireworks {
        width: 42px;
    }

    .spark {
        font-size: 16px;
    }

    .burst {
        font-size: 22px;
    }

    .brand {
        font-size: 21px;
    }

    .wishes {
        font-size: 29px;
    }

    h1 {
        font-size: 28px;
    }
}

@media(prefers-reduced-motion: reduce) {
    .spark, .burst, .firework {
        animation: none;
    }
}
</style>
</head>

<body>

<!-- LEFT FIREWORKS -->

<div class="fireworks left">
    <span class="spark">✨</span>
    <span class="spark">⭐</span>
    <span class="spark">🌟</span>
    <span class="spark">✨</span>
    <span class="spark">💥</span>

    <span class="burst" style="top:35%;left:15%">🎆</span>
    <span class="burst" style="top:75%;left:20%;animation-delay:1s">🎇</span>

    <span class="firework one"></span>
    <span class="firework two"></span>
</div>

<!-- RIGHT FIREWORKS -->

<div class="fireworks right">
    <span class="spark">🌟</span>
    <span class="spark">✨</span>
    <span class="spark">⭐</span>
    <span class="spark">💥</span>
    <span class="spark">✨</span>

    <span class="burst" style="top:20%;left:15%">🎇</span>
    <span class="burst" style="top:60%;left:20%;animation-delay:1.2s">🎆</span>

    <span class="firework one"></span>
    <span class="firework two"></span>
</div>

<!-- HEADER -->

<h1>✨ GS & Co ✨</h1>

<div class="subtitle">
    Capture Your Diwali Memories!
</div>

<!-- SELFIE BOOTH -->

<div class="booth">

    <div class="brand">
        DIWALI SELFIE BOOTH
    </div>

    <video id="camera" autoplay playsinline muted></video>

    <canvas id="result"></canvas>

    <div class="wishes">
        <small>Wishing You a</small>
        Happy Diwali!
        <small>✨ Celebrate Happiness Together ✨</small>
    </div>

    <button id="start">
        📸 Start Camera
    </button>

    <button id="capture" disabled>
        ✨ Take Selfie
    </button>

    <button id="retake" class="secondary" disabled>
        🔄 Retake Photo
    </button>

    <button id="download" class="secondary" disabled>
        ⬇ Download Photo
    </button>

    <button id="whatsapp" disabled>
        💚 Share on WhatsApp
    </button>

    <button id="instagram" disabled>
        📷 Share on Instagram
    </button>

</div>

<div class="note">
    Celebrate Diwali with GS & Co.
    Capture your special moments and share them!
</div>

<div class="status" id="status">
    Loading GS & Co Logo...
</div>

<script>

// =================================
// ELEMENTS
// =================================

const video = document.getElementById("camera");
const canvas = document.getElementById("result");
const ctx = canvas.getContext("2d");

const statusText = document.getElementById("status");

const startBtn = document.getElementById("start");
const captureBtn = document.getElementById("capture");
const retakeBtn = document.getElementById("retake");
const downloadBtn = document.getElementById("download");
const whatsappBtn = document.getElementById("whatsapp");
const instagramBtn = document.getElementById("instagram");

let stream = null;
let photoReady = false;
let logoReady = false;


// =================================
// LOAD ORIGINAL GS & CO LOGO
// =================================

const logo = new Image();

const logoPromise = new Promise((resolve, reject) => {

    logo.onload = () => {
        logoReady = true;
        console.log("GS & Co Logo Loaded Successfully");
        resolve(true);
    };

    logo.onerror = () => {
        reject(new Error(
            "Logo not found. Check gs-logo.png in GitHub."
        ));
    };

    logo.src = "./gs-logo.png";

});


// =================================
// BUTTON CONTROL
// =================================

function setButtons(enabled) {

    downloadBtn.disabled = !enabled;
    whatsappBtn.disabled = !enabled;
    instagramBtn.disabled = !enabled;
    retakeBtn.disabled = !enabled;

}


// =================================
// START CAMERA
// =================================

async function startCamera() {

    try {

        statusText.textContent =
            "Checking GS & Co Logo...";

        await logoPromise;

        if (!navigator.mediaDevices?.getUserMedia) {
            throw new Error(
                "Camera requires HTTPS or localhost."
            );
        }

        if (stream) {
            stream.getTracks().forEach(
                track => track.stop()
            );
        }

        stream = await navigator.mediaDevices.getUserMedia({

            video: {
                facingMode: "user",
                width: { ideal: 1080 },
                height: { ideal: 1350 }
            },

            audio: false

        });

        video.srcObject = stream;

        await video.play();

        video.style.display = "block";
        canvas.style.display = "none";

        captureBtn.disabled = false;

        photoReady = false;
        setButtons(false);

        statusText.textContent =
            "GS & Co Logo Ready! Camera Ready!";

    }

    catch (error) {

        statusText.textContent =
            "Error: " + error.message;

        captureBtn.disabled = true;

    }

}


// =================================
// CAPTURE SELFIE
// =================================

async function capturePhoto() {

    if (!video.videoWidth) {
        statusText.textContent = "Camera is not ready.";
        return;
    }

    if (!logoReady) {
        statusText.textContent = "GS & Co Logo not ready.";
        return;
    }

    captureBtn.disabled = true;

    try {

        await logo.decode();

        const W = 1080;
        const H = 1350;

        canvas.width = W;
        canvas.height = H;

        // CAMERA CROP

        const sourceRatio =
            video.videoWidth / video.videoHeight;

        const targetRatio = W / H;

        let sx = 0;
        let sy = 0;
        let sw = video.videoWidth;
        let sh = video.videoHeight;

        if (sourceRatio > targetRatio) {

            sw = video.videoHeight * targetRatio;
            sx = (video.videoWidth - sw) / 2;

        } else {

            sh = video.videoWidth / targetRatio;
            sy = (video.videoHeight - sh) / 2;

        }

        // MIRRORED SELFIE

        ctx.save();

        ctx.translate(W, 0);
        ctx.scale(-1, 1);

        ctx.drawImage(
            video,
            sx, sy, sw, sh,
            0, 0, W, H
        );

        ctx.restore();


        // =================================
        // GS LOGO - TOP LEFT CORNER
        // =================================

        const logoWidth = 330;

        const logoHeight =
            logoWidth *
            (logo.naturalHeight / logo.naturalWidth);

        // Logo background shadow

        ctx.save();

        ctx.shadowColor = "rgba(0,0,0,0.25)";
        ctx.shadowBlur = 15;

        ctx.drawImage(
            logo,
            45,
            45,
            logoWidth,
            logoHeight
        );

        ctx.restore();


        // =================================
        // GOLD FRAME
        // =================================

        ctx.lineWidth = 18;
        ctx.strokeStyle = "#e9bd50";

        ctx.strokeRect(
            10, 10,
            W - 20,
            H - 20
        );

        ctx.lineWidth = 5;
        ctx.strokeStyle = "#fff0bd";

        ctx.strokeRect(
            32, 32,
            W - 64,
            H - 64
        );


        // =================================
        // DIWALI GREETING PANEL
        // =================================

        const bottom = ctx.createLinearGradient(
            0, 1030, 0, H
        );

        bottom.addColorStop(
            0, "rgba(180,45,10,0.88)"
        );

        bottom.addColorStop(
            1, "rgba(105,25,5,0.98)"
        );

        ctx.fillStyle = bottom;

        ctx.fillRect(
            20, 1030,
            W - 40,
            300
        );

        // GOLD BORDER

        ctx.strokeStyle = "#ffd36b";
        ctx.lineWidth = 6;

        ctx.strokeRect(
            42, 1050,
            W - 84,
            258
        );


        // GREETING TEXT

        ctx.textAlign = "center";
        ctx.fillStyle = "#fff0b3";

        ctx.font = "bold 38px Georgia";

        ctx.fillText(
            "Wishing You a",
            W / 2,
            1110
        );

        ctx.font = "bold italic 78px Georgia";

        ctx.fillText(
            "Happy Diwali!",
            W / 2,
            1205
        );

        ctx.font = "28px Arial";

        ctx.fillText(
            "Celebrate Happiness Together!",
            W / 2,
            1260
        );


        // =================================
        // SHOW FINAL PHOTO
        // =================================

        video.style.display = "none";
        canvas.style.display = "block";

        photoReady = true;

        setButtons(true);

        statusText.textContent =
            "Success! GS & Co Logo Added to Your Selfie!";

    }

    catch (error) {

        statusText.textContent =
            "Photo Error: " + error.message;

    }

    finally {

        captureBtn.disabled = false;

    }

}


// =================================
// CREATE IMAGE FILE
// =================================

function makeFile() {

    return new Promise((resolve, reject) => {

        canvas.toBlob(blob => {

            if (!blob) {
                reject(new Error("Photo creation failed."));
                return;
            }

            const file = new File(
                [blob],
                "GS-Co-Diwali.png",
                { type: "image/png" }
            );

            resolve(file);

        }, "image/png");

    });

}


// =================================
// DOWNLOAD PHOTO
// =================================

function downloadFile(file) {

    const url = URL.createObjectURL(file);

    const link = document.createElement("a");

    link.href = url;
    link.download = "GS-Co-Diwali.png";

    document.body.appendChild(link);

    link.click();

    link.remove();

    setTimeout(() => {
        URL.revokeObjectURL(url);
    }, 60000);

}

downloadBtn.addEventListener("click", async () => {

    try {

        if (!photoReady) return;

        const file = await makeFile();

        downloadFile(file);

        statusText.textContent =
            "GS & Co Photo Downloaded Successfully!";

    }

    catch (error) {

        statusText.textContent = error.message;

    }

});


// =================================
// WHATSAPP & INSTAGRAM SHARE
// =================================

async function sharePhoto(app) {

    if (!photoReady) return;

    try {

        const file = await makeFile();

        if (
            navigator.share &&
            navigator.canShare &&
            navigator.canShare({ files: [file] })
        ) {

            await navigator.share({

                files: [file],

                title: "GS & Co - Happy Diwali",

                text: "Happy Diwali from GS & Co! ✨🪔"

            });

            statusText.textContent =
                "Choose " + app + " from the share menu.";

            return;

        }

        // FALLBACK FOR UNSUPPORTED BROWSERS

        downloadFile(file);

        if (app === "WhatsApp") {

            window.open(
                "https://wa.me/?text=" +
                encodeURIComponent(
                    "Happy Diwali from GS & Co! ✨🪔"
                ),
                "_blank"
            );

        } else {

            window.open(
                "https://www.instagram.com/",
                "_blank"
            );

        }

        statusText.textContent =
            "Photo downloaded. Attach it in " + app + ".";

    }

    catch (error) {

        if (error.name !== "AbortError") {

            statusText.textContent =
                "Sharing unavailable. Download and share manually.";

        }

    }

}


// =================================
// RETAKE PHOTO
// =================================

retakeBtn.addEventListener("click", () => {

    if (!stream) return;

    video.style.display = "block";
    canvas.style.display = "none";

    photoReady = false;

    setButtons(false);

    statusText.textContent =
        "Camera Ready! Take Another Selfie.";

});


// =================================
// BUTTON EVENTS
// =================================

startBtn.addEventListener("click", startCamera);

captureBtn.addEventListener("click", capturePhoto);

whatsappBtn.addEventListener(
    "click",
    () => sharePhoto("WhatsApp")
);

instagramBtn.addEventListener(
    "click",
    () => sharePhoto("Instagram")
);


// =================================
// LOGO CHECK
// =================================

logoPromise.then(() => {

    statusText.textContent =
        "GS & Co Logo Loaded! Click Start Camera.";

}).catch(error => {

    statusText.textContent = error.message;
    captureBtn.disabled = true;

});


// =================================
// STOP CAMERA
// =================================

window.addEventListener("pagehide", () => {

    if (stream) {
        stream.getTracks().forEach(
            track => track.stop()
        );
    }

});

</script>

</body>
</html>
