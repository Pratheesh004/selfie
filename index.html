
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Selvi Silks - Grand Diwali Selfie Booth</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px 12px;
    min-height: 100vh;
    background: linear-gradient(135deg, #f9edff, #ead9ff, #fff3e8);
    font-family: Arial, sans-serif;
    text-align: center;
    overflow-x: hidden;
}

h1 {
    color: #6500bd;
    font-size: 34px;
    margin: 10px 0;
    position: relative;
    z-index: 2;
}

.subtitle {
    color: #71318c;
    font-size: 18px;
    margin-bottom: 18px;
    position: relative;
    z-index: 2;
}

/* FIREWORKS */

.fireworks {
    position: fixed;
    top: 0;
    bottom: 0;
    width: 90px;
    overflow: hidden;
    pointer-events: none;
    z-index: 1;
}

.left { left: 0; }
.right { right: 0; }

.spark {
    position: absolute;
    font-size: 24px;
    animation: sparkle 2s infinite;
    filter: drop-shadow(0 0 10px #c17aff);
}

.spark:nth-child(1) { top: 12%; left: 20%; }
.spark:nth-child(2) { top: 28%; left: 60%; animation-delay: .5s; }
.spark:nth-child(3) { top: 45%; left: 15%; animation-delay: 1s; }
.spark:nth-child(4) { top: 65%; left: 60%; animation-delay: .3s; }
.spark:nth-child(5) { top: 83%; left: 25%; animation-delay: .8s; }

@keyframes sparkle {
    0%, 100% {
        transform: scale(.4) rotate(0deg);
        opacity: .2;
    }
    50% {
        transform: scale(1.5) rotate(90deg);
        opacity: 1;
    }
}

.burst {
    position: absolute;
    font-size: 32px;
    animation: burst 2.5s infinite;
}

@keyframes burst {
    0% { transform: scale(.2); opacity: 0; }
    40% { transform: scale(1.3); opacity: 1; }
    100% { transform: scale(.3) rotate(180deg); opacity: 0; }
}

/* MAIN BOOTH */

.booth {
    width: min(100%, 540px);
    margin: auto;
    padding: 12px;

    background: linear-gradient(
        145deg,
        #8500d5,
        #5700a0,
        #30005c
    );

    border: 7px solid #e7c46d;
    border-radius: 40px;

    box-shadow: 0 12px 35px #55008035;

    position: relative;
    z-index: 2;
}

.brand {
    padding: 12px 5px;
    color: #fff0c2;
    font-size: 22px;
    font-weight: bold;
    letter-spacing: 1.5px;
}

/* FRAME PREVIEW */

.camera-stage {
    width: 100%;
    aspect-ratio: 1706 / 2048;
    position: relative;
    overflow: hidden;
    background: #fff0e7;
}

#camera {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
    display: none;
}

#framePreview {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: fill;
    pointer-events: none;
    z-index: 2;
}

#result {
    display: none;
    width: 100%;
    height: auto;
    aspect-ratio: 1706 / 2048;
    object-fit: contain;
    background: transparent;
}

/* WISHES */

.wishes {
    margin: 12px 0;
    padding: 17px 5px;

    background: linear-gradient(
        135deg,
        #fff,
        #f1e2ff
    );

    color: #6500b5;
    border: 3px solid #e7c46d;
    border-radius: 20px;

    font: bold italic 30px Georgia, serif;
}

.wishes small {
    display: block;
    font: bold 14px Arial;
    margin-bottom: 5px;
}

/* BUTTONS */

button {
    width: 100%;
    margin-top: 10px;
    padding: 15px 10px;

    border: 2px solid #f4d995;
    border-radius: 12px;

    font-size: 16px;
    font-weight: bold;
    cursor: pointer;

    background: #f0d17e;
    color: #4c087a;
}

button:disabled {
    opacity: .4;
    cursor: not-allowed;
}

.secondary {
    background: #fff;
    color: #6500b5;
    border-color: #d9b9ef;
}

.status {
    color: #6500a9;
    font-size: 14px;
    line-height: 1.5;
    margin: 15px auto;
    max-width: 500px;
    position: relative;
    z-index: 2;
}

.note {
    color: #71318c;
    font-size: 12px;
    margin: 15px auto;
    line-height: 1.6;
    position: relative;
    z-index: 2;
}

@media(max-width: 600px) {
    .fireworks { width: 38px; }
    .spark { font-size: 15px; }
    .burst { font-size: 20px; }
    h1 { font-size: 27px; }
    .brand { font-size: 18px; }
    .wishes { font-size: 26px; }
}

@media(prefers-reduced-motion: reduce) {
    .spark, .burst {
        animation: none;
    }
}
</style>
</head>

<body>

<!-- LEFT FIREWORKS -->

<div class="fireworks left">
    <span class="spark">✨</span>
    <span class="spark">⭐</span>
    <span class="spark">💜</span>
    <span class="spark">✨</span>
    <span class="spark">🌟</span>
    <span class="burst" style="top:35%;left:15%">🎆</span>
    <span class="burst" style="top:75%;left:20%;animation-delay:1s">🎇</span>
</div>

<!-- RIGHT FIREWORKS -->

<div class="fireworks right">
    <span class="spark">🌟</span>
    <span class="spark">✨</span>
    <span class="spark">💜</span>
    <span class="spark">⭐</span>
    <span class="spark">✨</span>
    <span class="burst" style="top:20%;left:15%">🎇</span>
    <span class="burst" style="top:60%;left:20%;animation-delay:1s">🎆</span>
</div>

<!-- HEADER -->

<h1>🪔 Selvi Silks 🪔</h1>

<div class="subtitle">
    Capture Your Diwali Memories!
</div>

<!-- BOOTH -->

<div class="booth">

    <div class="brand">
        GRAND DIWALI SELFIE BOOTH
    </div>

    <!-- CAMERA AND FRAME -->

    <div class="camera-stage" id="cameraStage">

        <video id="camera"
               autoplay
               playsinline
               muted>
        </video>

        <img id="framePreview"
             src="./selvi-frame.png"
             alt="Selvi Silks Diwali Frame">

    </div>

    <!-- FINAL PHOTO -->

    <canvas id="result"></canvas>

    <div class="wishes">
        <small>Wishing You a</small>
        Happy Diwali!
        <small>✨ Let Your Happiness Shine ✨</small>
    </div>

    <button id="start">
        📸 Start Camera
    </button>

    <button id="capture" disabled>
        ✨ Take Selfie
    </button>

    <button id="retake" class="secondary" disabled>
        🔄 Retake Photo
    </button>

    <button id="download" class="secondary" disabled>
        ⬇ Download Photo
    </button>

    <button id="whatsapp" disabled>
        💚 Share on WhatsApp
    </button>

    <button id="instagram" disabled>
        📷 Share on Instagram
    </button>

</div>

<div class="note">
    Celebrate the Festival of Lights with Selvi Silks!
</div>

<div class="status" id="status">
    Loading Selvi Silks Diwali Frame...
</div>


<script>

// =================================
// ELEMENTS
// =================================

const video = document.getElementById("camera");
const canvas = document.getElementById("result");
const ctx = canvas.getContext("2d");

const framePreview = document.getElementById("framePreview");
const cameraStage = document.getElementById("cameraStage");

const statusText = document.getElementById("status");

const startBtn = document.getElementById("start");
const captureBtn = document.getElementById("capture");
const retakeBtn = document.getElementById("retake");
const downloadBtn = document.getElementById("download");
const whatsappBtn = document.getElementById("whatsapp");
const instagramBtn = document.getElementById("instagram");

let stream = null;
let photoReady = false;


// =================================
// LOAD FRAME
// =================================

const frame = new Image();

const framePromise = new Promise((resolve, reject) => {

    frame.onload = () => {
        console.log("Selvi Silks Frame Loaded");
        resolve();
    };

    frame.onerror = () => {
        reject(new Error(
            "Frame not found! Check selvi-frame.png filename."
        ));
    };

    frame.src = "./selvi-frame.png";

});


// =================================
// FRAME COORDINATES
// Based on 1706 x 2048 image
// =================================

const FRAME_W = 1706;
const FRAME_H = 2048;

// Transparent photo window coordinates
const PHOTO_X = 285;
const PHOTO_Y = 770;
const PHOTO_W = 1136;
const PHOTO_H = 975;


// =================================
// BUTTON CONTROL
// =================================

function setButtons(enabled) {

    downloadBtn.disabled = !enabled;
    whatsappBtn.disabled = !enabled;
    instagramBtn.disabled = !enabled;
    retakeBtn.disabled = !enabled;

}


// =================================
// START CAMERA
// =================================

async function startCamera() {

    try {

        statusText.textContent =
            "Checking Selvi Silks Frame...";

        await framePromise;

        if (!navigator.mediaDevices?.getUserMedia) {

            throw new Error(
                "Camera requires HTTPS or localhost."
            );

        }

        if (stream) {
            stream.getTracks().forEach(track => track.stop());
            stream = null;
        }

        statusText.textContent =
            "Requesting Camera Permission...";

        stream = await navigator.mediaDevices.getUserMedia({

            video: {
                facingMode: "user",
                width: { ideal: 1280 },
                height: { ideal: 1600 }
            },

            audio: false

        });

        video.srcObject = stream;

        await new Promise((resolve, reject) => {

            video.onloadedmetadata = resolve;

            video.onerror = () => reject(
                new Error("Camera preview failed.")
            );

        });

        await video.play();

        video.style.display = "block";
        framePreview.style.display = "block";
        cameraStage.style.display = "block";
        canvas.style.display = "none";

        captureBtn.disabled = false;

        photoReady = false;
        setButtons(false);

        statusText.textContent =
            "Camera Ready! Selvi Silks Frame Loaded.";

    }

    catch (error) {

        console.error("Camera Error:", error);

        let message = "Camera Error: ";

        if (error.name === "NotAllowedError") {
            message += "Please allow camera permission in Chrome.";
        }
        else if (error.name === "NotFoundError") {
            message += "No camera detected.";
        }
        else if (error.name === "NotReadableError") {
            message += "Camera is being used by another application.";
        }
        else {
            message += error.message;
        }

        statusText.textContent = message;
        captureBtn.disabled = true;

    }

}


// =================================
// DRAW SELFIE INSIDE FRAME
// =================================

async function capturePhoto() {

    if (!video.videoWidth) {
        statusText.textContent = "Camera is not ready.";
        return;
    }

    captureBtn.disabled = true;

    try {

        await framePromise;

        // Keep exact frame aspect ratio
        canvas.width = FRAME_W;
        canvas.height = FRAME_H;

        // Crop camera image to photo window ratio
        const targetRatio = PHOTO_W / PHOTO_H;

        const sourceRatio =
            video.videoWidth / video.videoHeight;

        let sx = 0;
        let sy = 0;
        let sw = video.videoWidth;
        let sh = video.videoHeight;

        if (sourceRatio > targetRatio) {

            sw = video.videoHeight * targetRatio;
            sx = (video.videoWidth - sw) / 2;

        } else {

            sh = video.videoWidth / targetRatio;
            sy = (video.videoHeight - sh) / 2;

        }

        // Draw selfie in transparent window
        ctx.save();

        ctx.translate(
            PHOTO_X + PHOTO_W,
            PHOTO_Y
        );

        ctx.scale(-1, 1);

        ctx.drawImage(
            video,
            sx, sy, sw, sh,
            0, 0, PHOTO_W, PHOTO_H
        );

        ctx.restore();

        // Draw complete original frame over selfie
        ctx.drawImage(
            frame,
            0, 0,
            FRAME_W, FRAME_H
        );

        // Show captured photo
        cameraStage.style.display = "none";
        canvas.style.display = "block";

        photoReady = true;
        setButtons(true);

        statusText.textContent =
            "Your Selvi Silks Grand Diwali Selfie is Ready!";

    }

    catch (error) {

        console.error(error);

        statusText.textContent =
            "Photo Error: " + error.message;

    }

    finally {

        captureBtn.disabled = false;

    }

}


// =================================
// CREATE PHOTO FILE
// =================================

function makeFile() {

    return new Promise((resolve, reject) => {

        canvas.toBlob(blob => {

            if (!blob) {
                reject(new Error("Photo creation failed."));
                return;
            }

            const file = new File(
                [blob],
                "Selvi-Silks-Grand-Diwali.png",
                { type: "image/png" }
            );

            resolve(file);

        }, "image/png");

    });

}


// =================================
// DOWNLOAD PHOTO
// =================================

function downloadFile(file) {

    const url = URL.createObjectURL(file);

    const link = document.createElement("a");

    link.href = url;
    link.download = "Selvi-Silks-Grand-Diwali.png";

    document.body.appendChild(link);

    link.click();
    link.remove();

    setTimeout(() => {
        URL.revokeObjectURL(url);
    }, 60000);

}

downloadBtn.addEventListener("click", async () => {

    try {

        if (!photoReady) return;

        const file = await makeFile();

        downloadFile(file);

        statusText.textContent =
            "Photo Downloaded Successfully!";

    }

    catch (error) {
        statusText.textContent = error.message;
    }

});


// =================================
// WHATSAPP AND INSTAGRAM
// =================================

async function sharePhoto(app) {

    if (!photoReady) return;

    try {

        const file = await makeFile();

        if (
            navigator.share &&
            navigator.canShare &&
            navigator.canShare({ files: [file] })
        ) {

            await navigator.share({

                files: [file],

                title: "Selvi Silks - Happy Diwali",

                text: "Happy Diwali from Selvi Silks! 🪔✨"

            });

            statusText.textContent =
                "Choose " + app + " from the share menu.";

            return;

        }

        // Fallback for browsers without file sharing
        downloadFile(file);

        if (app === "WhatsApp") {

            window.open(
                "https://wa.me/?text=" +
                encodeURIComponent(
                    "Happy Diwali from Selvi Silks! 🪔✨"
                ),
                "_blank"
            );

        } else {

            window.open(
                "https://www.instagram.com/",
                "_blank"
            );

        }

        statusText.textContent =
            "Photo downloaded. Attach it in " + app + ".";

    }

    catch (error) {

        if (error.name !== "AbortError") {

            statusText.textContent =
                "Please download and share your photo manually.";

        }

    }

}


// =================================
// RETAKE PHOTO
// =================================

retakeBtn.addEventListener("click", () => {

    if (!stream) return;

    cameraStage.style.display = "block";
    video.style.display = "block";
    framePreview.style.display = "block";

    canvas.style.display = "none";

    photoReady = false;

    setButtons(false);

    statusText.textContent =
        "Camera Ready! Take Another Selfie.";

});


// =================================
// BUTTON EVENTS
// =================================

startBtn.addEventListener("click", startCamera);

captureBtn.addEventListener("click", capturePhoto);

whatsappBtn.addEventListener(
    "click",
    () => sharePhoto("WhatsApp")
);

instagramBtn.addEventListener(
    "click",
    () => sharePhoto("Instagram")
);


// =================================
// INITIAL FRAME CHECK
// =================================

framePromise.then(() => {

    statusText.textContent =
        "Selvi Silks Grand Diwali Frame Loaded!";

}).catch(error => {

    statusText.textContent = error.message;

    captureBtn.disabled = true;

});


// =================================
// STOP CAMERA WHEN LEAVING
// =================================

window.addEventListener("pagehide", () => {

    if (stream) {

        stream.getTracks().forEach(
            track => track.stop()
        );

    }

});

</script>

</body>
</html>
