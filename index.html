
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Selvi Silks - Diwali Selfie Booth</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px 12px;
    background: #fff0d4;
    font-family: Arial, sans-serif;
    text-align: center;
    overflow-x: hidden;
}

h1 {
    color: #7900c9;
    font-size: 34px;
    margin: 10px 0;
    position: relative;
    z-index: 2;
}

.subtitle {
    color: #744322;
    margin-bottom: 22px;
    font-size: 18px;
    position: relative;
    z-index: 2;
}

/* ==================================
   SIDE FIREWORKS
================================== */

.fireworks {
    position: fixed;
    top: 0;
    bottom: 0;
    width: 110px;
    pointer-events: none;
    overflow: hidden;
    z-index: 1;
}

.fireworks.left {
    left: 0;
}

.fireworks.right {
    right: 0;
}

.spark {
    position: absolute;
    font-size: 23px;
    animation: sparkle 2s infinite ease-in-out;
    filter: drop-shadow(0 0 10px gold);
}

.spark:nth-child(1) {
    top: 10%;
    left: 20%;
    animation-delay: 0s;
}

.spark:nth-child(2) {
    top: 25%;
    left: 60%;
    animation-delay: .5s;
}

.spark:nth-child(3) {
    top: 42%;
    left: 15%;
    animation-delay: 1s;
}

.spark:nth-child(4) {
    top: 60%;
    left: 65%;
    animation-delay: .3s;
}

.spark:nth-child(5) {
    top: 80%;
    left: 25%;
    animation-delay: .8s;
}

@keyframes sparkle {
    0%, 100% {
        transform: scale(.4) rotate(0deg);
        opacity: .2;
    }

    50% {
        transform: scale(1.5) rotate(90deg);
        opacity: 1;
    }
}

/* Firework bursts */

.firework-burst {
    position: absolute;
    font-size: 35px;
    animation: burst 2.5s infinite;
    filter: drop-shadow(0 0 12px orange);
}

@keyframes burst {
    0% {
        transform: scale(.2) rotate(0deg);
        opacity: 0;
    }

    40% {
        transform: scale(1.3) rotate(45deg);
        opacity: 1;
    }

    70% {
        transform: scale(1.7) rotate(90deg);
        opacity: .8;
    }

    100% {
        transform: scale(.3) rotate(180deg);
        opacity: 0;
    }
}

/* CSS Firework particles */

.firework {
    position: absolute;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #ffb800;
    box-shadow:
        0 -25px #ffcf33,
        18px -18px #ff6b00,
        25px 0 #ffe45e,
        18px 18px #ff8c00,
        0 25px #fff176,
        -18px 18px #ff9f1c,
        -25px 0 #ffe45e,
        -18px -18px #ff6b00;
    animation: explode 2.5s infinite;
}

.firework.one {
    top: 30%;
    left: 35%;
}

.firework.two {
    top: 70%;
    left: 45%;
    animation-delay: 1.2s;
}

@keyframes explode {
    0% {
        transform: scale(.1);
        opacity: 0;
    }

    40% {
        transform: scale(1);
        opacity: 1;
    }

    100% {
        transform: scale(.2);
        opacity: 0;
    }
}

/* ==================================
   MAIN BOOTH
================================== */

.booth {
    width: min(100%, 540px);
    margin: auto;
    padding: 12px;
    background: linear-gradient(
        145deg,
        #680021,
        #b00d45,
        #62001e
    );
    border: 6px solid #edc05b;
    border-radius: 60px 60px 20px 20px;
    box-shadow: 0 10px 25px #6d301b40;
    position: relative;
    z-index: 2;
}

.brand {
    padding: 16px 5px;
    color: #ffe6a0;
    font-size: 27px;
    font-weight: bold;
    letter-spacing: 2px;
}

#camera,
#result {
    display: block;
    width: 100%;
    aspect-ratio: 4 / 5;
    object-fit: cover;
    background: #fff6e7;
    border: 6px solid #e9bf64;
    border-radius: 35px 35px 10px 10px;
}

#camera {
    transform: scaleX(-1);
}

#result {
    display: none;
}

.wishes {
    margin: 15px 0 5px;
    padding: 15px 5px;
    border: 3px solid #edc05b;
    border-radius: 30px;
    color: #790329;
    background: #ffdf91;
    font: italic bold 35px Georgia, serif;
}

.wishes small {
    display: block;
    font: bold 15px Arial, sans-serif;
    margin-bottom: 5px;
}

button {
    width: 100%;
    margin-top: 11px;
    padding: 15px 10px;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    background: #8b123b;
    color: white;
}

button:disabled {
    opacity: .4;
    cursor: not-allowed;
}

.secondary {
    background: #f2c65f;
    color: #58132a;
}

.status {
    color: #6c1730;
    font-size: 14px;
    margin: 15px auto;
    max-width: 500px;
    line-height: 1.5;
    position: relative;
    z-index: 2;
}

.note {
    max-width: 500px;
    margin: 15px auto;
    color: #68452c;
    font-size: 12px;
    line-height: 1.6;
    position: relative;
    z-index: 2;
}

/* ==================================
   MOBILE RESPONSIVE
================================== */

@media(max-width: 600px) {

    .fireworks {
        width: 42px;
    }

    .spark {
        font-size: 16px;
    }

    .firework-burst {
        font-size: 22px;
    }

    .brand {
        font-size: 22px;
    }

    .wishes {
        font-size: 29px;
    }

    h1 {
        font-size: 28px;
    }
}

@media(prefers-reduced-motion: reduce) {
    .spark,
    .firework-burst,
    .firework {
        animation: none;
    }
}
</style>
</head>

<body>

<!-- ==================================
     LEFT SIDE FIREWORKS
================================== -->

<div class="fireworks left">

    <span class="spark">✨</span>
    <span class="spark">⭐</span>
    <span class="spark">🌟</span>
    <span class="spark">✨</span>
    <span class="spark">💥</span>

    <span class="firework-burst"
          style="top:35%;left:15%">🎆</span>

    <span class="firework-burst"
          style="top:72%;left:20%;animation-delay:1s">
          🎇
    </span>

    <span class="firework one"></span>
    <span class="firework two"></span>

</div>


<!-- ==================================
     RIGHT SIDE FIREWORKS
================================== -->

<div class="fireworks right">

    <span class="spark">🌟</span>
    <span class="spark">✨</span>
    <span class="spark">⭐</span>
    <span class="spark">💥</span>
    <span class="spark">✨</span>

    <span class="firework-burst"
          style="top:20%;left:15%">🎇</span>

    <span class="firework-burst"
          style="top:55%;left:20%;animation-delay:1.2s">
          🎆
    </span>

    <span class="firework one"></span>
    <span class="firework two"></span>

</div>


<!-- ==================================
     WEBSITE HEADER
================================== -->

<h1>🪔 Selvi Silks 🪔</h1>

<div class="subtitle">
    Capture Your Diwali Memories!
</div>


<!-- ==================================
     SELFIE BOOTH
================================== -->

<div class="booth">

    <div class="brand">
        DIWALI SELFIE BOOTH
    </div>

    <video id="camera"
           autoplay
           playsinline
           muted></video>

    <canvas id="result"></canvas>

    <div class="wishes">
        <small>Wishing You a</small>
        Happy Diwali!
        <small>✨ Let Your Happiness Shine ✨</small>
    </div>

    <button id="start">
        📸 Start Camera
    </button>

    <button id="capture" disabled>
        ✨ Take Selfie
    </button>

    <button id="retake" class="secondary" disabled>
        🔄 Retake Photo
    </button>

    <button id="download" class="secondary" disabled>
        ⬇ Download Photo
    </button>

    <button id="whatsapp" disabled>
        💚 Share Photo on WhatsApp
    </button>

    <button id="instagram" disabled>
        📷 Share Photo on Instagram
    </button>

</div>


<div class="note">
    Take your selfie with the original Selvi Silks logo.
    Download and share your Diwali memories!
</div>

<div class="status" id="status">
    Loading Selvi Silks Logo...
</div>


<script>

// ======================================
// GET ELEMENTS
// ======================================

const video = document.getElementById("camera");
const canvas = document.getElementById("result");
const ctx = canvas.getContext("2d");

const statusText = document.getElementById("status");

const startBtn = document.getElementById("start");
const captureBtn = document.getElementById("capture");
const retakeBtn = document.getElementById("retake");
const downloadBtn = document.getElementById("download");
const whatsappBtn = document.getElementById("whatsapp");
const instagramBtn = document.getElementById("instagram");

let stream = null;
let photoReady = false;
let logoReady = false;


// ======================================
// LOAD ORIGINAL SELVI SILKS LOGO
// ======================================

const logo = new Image();

const logoPromise = new Promise((resolve, reject) => {

    logo.onload = () => {

        logoReady = true;

        console.log("Selvi Silks Logo Loaded Successfully");

        resolve(true);

    };

    logo.onerror = () => {

        logoReady = false;

        reject(
            new Error(
                "Logo not found. Check selvi-logo.png in GitHub."
            )
        );

    };

    logo.src = "./selvi-logo.png";

});


// ======================================
// BUTTON CONTROL
// ======================================

function setButtons(enabled) {

    downloadBtn.disabled = !enabled;
    whatsappBtn.disabled = !enabled;
    instagramBtn.disabled = !enabled;
    retakeBtn.disabled = !enabled;

}


// ======================================
// START CAMERA
// ======================================

async function startCamera() {

    try {

        statusText.textContent =
            "Checking Selvi Silks Logo...";

        await logoPromise;

        if (!navigator.mediaDevices?.getUserMedia) {

            throw new Error(
                "Camera requires HTTPS or localhost."
            );

        }

        if (stream) {

            stream.getTracks().forEach(
                track => track.stop()
            );

        }

        stream = await navigator.mediaDevices.getUserMedia({

            video: {

                facingMode: "user",

                width: { ideal: 1080 },

                height: { ideal: 1350 }

            },

            audio: false

        });

        video.srcObject = stream;

        await video.play();

        video.style.display = "block";
        canvas.style.display = "none";

        captureBtn.disabled = false;

        photoReady = false;

        setButtons(false);

        statusText.textContent =
            "Logo Ready! Camera Ready! Take Your Selfie.";

    }

    catch (error) {

        statusText.textContent =
            "Error: " + error.message;

        captureBtn.disabled = true;

    }

}


// ======================================
// CAPTURE SELFIE
// ======================================

async function capturePhoto() {

    if (!video.videoWidth) {

        statusText.textContent = "Camera is not ready.";

        return;

    }

    if (!logoReady) {

        statusText.textContent =
            "Selvi Silks Logo is not ready.";

        return;

    }

    captureBtn.disabled = true;

    try {

        await logo.decode();

        const W = 1080;
        const H = 1350;

        canvas.width = W;
        canvas.height = H;

        // CAMERA CROP

        const sourceRatio =
            video.videoWidth / video.videoHeight;

        const targetRatio = W / H;

        let sx = 0;
        let sy = 0;
        let sw = video.videoWidth;
        let sh = video.videoHeight;

        if (sourceRatio > targetRatio) {

            sw = video.videoHeight * targetRatio;

            sx = (video.videoWidth - sw) / 2;

        } else {

            sh = video.videoWidth / targetRatio;

            sy = (video.videoHeight - sh) / 2;

        }

        // MIRRORED SELFIE

        ctx.save();

        ctx.translate(W, 0);
        ctx.scale(-1, 1);

        ctx.drawImage(
            video,
            sx, sy, sw, sh,
            0, 0, W, H
        );

        ctx.restore();


        // ORIGINAL SELVI SILKS LOGO

        const logoWidth = 760;

        const logoHeight =
            logoWidth *
            (logo.naturalHeight / logo.naturalWidth);

        ctx.drawImage(
            logo,
            (W - logoWidth) / 2,
            35,
            logoWidth,
            logoHeight
        );


        // GOLD BORDER

        ctx.lineWidth = 18;
        ctx.strokeStyle = "#efc45e";

        ctx.strokeRect(
            10, 10,
            W - 20,
            H - 20
        );

        ctx.lineWidth = 5;
        ctx.strokeStyle = "#fff0bd";

        ctx.strokeRect(
            32, 32,
            W - 64,
            H - 64
        );


        // DIWALI GREETING PANEL

        const bottom = ctx.createLinearGradient(
            0, 1030, 0, H
        );

        bottom.addColorStop(
            0, "rgba(91,0,30,0.85)"
        );

        bottom.addColorStop(
            1, "rgba(75,0,24,0.98)"
        );

        ctx.fillStyle = bottom;

        ctx.fillRect(
            20, 1030,
            W - 40,
            300
        );

        // GOLD PANEL BORDER

        ctx.strokeStyle = "#edc05b";
        ctx.lineWidth = 6;

        ctx.strokeRect(
            42, 1050,
            W - 84,
            258
        );

        // GREETING TEXT

        ctx.textAlign = "center";
        ctx.fillStyle = "#ffe6a0";

        ctx.font = "bold 38px Georgia";

        ctx.fillText(
            "Wishing You a",
            W / 2,
            1110
        );

        ctx.font = "bold italic 78px Georgia";

        ctx.fillText(
            "Happy Diwali!",
            W / 2,
            1205
        );

        ctx.font = "28px Arial";

        ctx.fillText(
            "Let Your Happiness Shine!",
            W / 2,
            1260
        );


        // SHOW FINAL PHOTO

        video.style.display = "none";

        canvas.style.display = "block";

        photoReady = true;

        setButtons(true);

        statusText.textContent =
            "Success! Selvi Silks Logo Added to Your Selfie!";

    }

    catch (error) {

        statusText.textContent =
            "Photo Error: " + error.message;

    }

    finally {

        captureBtn.disabled = false;

    }

}


// ======================================
// CREATE IMAGE FILE
// ======================================

function makeFile() {

    return new Promise((resolve, reject) => {

        canvas.toBlob(blob => {

            if (!blob) {

                reject(
                    new Error("Photo creation failed.")
                );

                return;

            }

            const file = new File(
                [blob],
                "Selvi-Silks-Diwali.png",
                { type: "image/png" }
            );

            resolve(file);

        }, "image/png");

    });

}


// ======================================
// DOWNLOAD PHOTO
// ======================================

function downloadFile(file) {

    const url = URL.createObjectURL(file);

    const link = document.createElement("a");

    link.href = url;

    link.download = "Selvi-Silks-Diwali.png";

    document.body.appendChild(link);

    link.click();

    link.remove();

    setTimeout(() => {

        URL.revokeObjectURL(url);

    }, 60000);

}


downloadBtn.addEventListener("click", async () => {

    try {

        if (!photoReady) return;

        const file = await makeFile();

        downloadFile(file);

        statusText.textContent =
            "Photo Downloaded Successfully!";

    }

    catch (error) {

        statusText.textContent = error.message;

    }

});


// ======================================
// WHATSAPP AND INSTAGRAM SHARING
// ======================================

async function sharePhoto(app) {

    if (!photoReady) return;

    try {

        const file = await makeFile();

        if (
            navigator.share &&
            navigator.canShare &&
            navigator.canShare({ files: [file] })
        ) {

            await navigator.share({

                files: [file],

                title: "Selvi Silks - Happy Diwali",

                text: "Happy Diwali from Selvi Silks! 🪔✨"

            });

            statusText.textContent =
                "Choose " + app + " from the share menu.";

            return;

        }

        // FALLBACK

        downloadFile(file);

        if (app === "WhatsApp") {

            window.open(
                "https://wa.me/?text=" +
                encodeURIComponent(
                    "Happy Diwali from Selvi Silks! 🪔✨"
                ),
                "_blank"
            );

        } else {

            window.open(
                "https://www.instagram.com/",
                "_blank"
            );

        }

        statusText.textContent =
            "Photo downloaded. Attach it in " + app + ".";

    }

    catch (error) {

        if (error.name !== "AbortError") {

            statusText.textContent =
                "Sharing unavailable. Download your photo and share manually.";

        }

    }

}


// ======================================
// RETAKE PHOTO
// ======================================

retakeBtn.addEventListener("click", () => {

    if (!stream) return;

    video.style.display = "block";

    canvas.style.display = "none";

    photoReady = false;

    setButtons(false);

    statusText.textContent =
        "Camera Ready! Take Another Selfie.";

});


// ======================================
// BUTTON EVENTS
// ======================================

startBtn.addEventListener(
    "click",
    startCamera
);

captureBtn.addEventListener(
    "click",
    capturePhoto
);

whatsappBtn.addEventListener(
    "click",
    () => sharePhoto("WhatsApp")
);

instagramBtn.addEventListener(
    "click",
    () => sharePhoto("Instagram")
);


// ======================================
// LOGO INITIAL CHECK
// ======================================

logoPromise.then(() => {

    statusText.textContent =
        "Selvi Silks Logo Loaded! Click Start Camera.";

}).catch(error => {

    statusText.textContent =
        error.message;

    captureBtn.disabled = true;

});


// ======================================
// STOP CAMERA
// ======================================

window.addEventListener("pagehide", () => {

    if (stream) {

        stream.getTracks().forEach(
            track => track.stop()
        );

    }

});

</script>

</body>
</html>
